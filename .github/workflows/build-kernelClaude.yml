name: Build Melt Kernel (marble)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核源码仓库"
        required: true
        default: "Pzqqt/android_kernel_xiaomi_marble"
      kernel_branch:
        description: "分支 / Tag（留空 = 仓库默认分支）"
        required: false
        default: ""
      defconfig:
        description: "defconfig（留空自动识别；可写多个，如：gki_defconfig vendor/waipio_GKI.config vendor/marble_GKI.config）"
        required: false
        default: ""
      make_targets:
        description: "make 目标"
        required: true
        default: "Image"
      clang_url:
        description: "Clang 工具链 tar.gz 下载地址（默认 AOSP clang-r450784d / Clang 14）"
        required: true
        default: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz"
      local_version:
        description: "附加版本后缀（LOCALVERSION，可留空）"
        required: false
        default: ""

env:
  ARCH: arm64
  SUBARCH: arm64
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ccache cpio curl git libelf-dev \
            libssl-dev lz4 python3 python-is-python3 rsync zip unzip \
            device-tree-compiler binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi kmod

      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo }}
          ref: ${{ github.event.inputs.kernel_branch }}
          path: kernel
          fetch-depth: 1
          submodules: recursive

      - name: 下载 Clang 工具链
        run: |
          mkdir -p "$HOME/clang"
          curl -fL --retry 3 -o /tmp/clang.tar.gz "${{ github.event.inputs.clang_url }}"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          # 兼容解压后多一层目录的压缩包
          if [ ! -x "$HOME/clang/bin/clang" ]; then
            inner=$(dirname "$(find "$HOME/clang" -maxdepth 3 -type f -path '*/bin/clang' | head -n1)")
            [ -n "$inner" ] && echo "CLANG_BIN=$inner" >> "$GITHUB_ENV"
          else
            echo "CLANG_BIN=$HOME/clang/bin" >> "$GITHUB_ENV"
          fi
          rm -f /tmp/clang.tar.gz

      - name: 检查工具链
        run: |
          test -x "$CLANG_BIN/clang" || { echo "::error::未找到 clang"; exit 1; }
          "$CLANG_BIN/clang" --version

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.kernel_repo }}-${{ github.event.inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.kernel_repo }}-${{ github.event.inputs.kernel_branch }}-

      - name: 确定 defconfig
        working-directory: kernel
        run: |
          echo "可用配置文件："
          ls arch/arm64/configs/ arch/arm64/configs/vendor/ 2>/dev/null || true

          CFG="${{ github.event.inputs.defconfig }}"
          if [ -z "$CFG" ]; then
            if [ -f arch/arm64/configs/marble_defconfig ]; then
              CFG="marble_defconfig"
            elif [ -f arch/arm64/configs/vendor/marble_GKI.config ] || [ -f arch/arm64/configs/vendor/marble_defconfig ]; then
              if [ -f arch/arm64/configs/vendor/marble_defconfig ]; then
                CFG="vendor/marble_defconfig"
              else
                # 小米 GKI 内核：gki_defconfig + 平台片段 + 小米片段 + 机型片段
                CFG="gki_defconfig"
                for f in vendor/waipio_GKI.config vendor/ukee_GKI.config vendor/xiaomi_GKI.config vendor/marble_GKI.config; do
                  [ -f "arch/arm64/configs/$f" ] && CFG="$CFG $f"
                done
              fi
            else
              echo "::error::无法自动识别 defconfig，请根据上面列出的文件手动填写 defconfig 参数"
              exit 1
            fi
          fi
          echo "使用配置：$CFG"
          echo "KERNEL_DEFCONFIG=$CFG" >> "$GITHUB_ENV"

      - name: 编译内核
        working-directory: kernel
        run: |
          export PATH="$CLANG_BIN:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          ccache -z

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          if [ -n "${{ github.event.inputs.local_version }}" ]; then
            MAKE_ARGS+=(LOCALVERSION="${{ github.event.inputs.local_version }}")
          fi

          make "${MAKE_ARGS[@]}" $KERNEL_DEFCONFIG
          # 去掉版本号里自动加的 -gxxxx / -dirty / + 后缀
          touch .scmversion
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO || true
          make "${MAKE_ARGS[@]}" olddefconfig

          set -o pipefail
          START=$(date +%s)
          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" ${{ github.event.inputs.make_targets }} 2>&1 | tee ../build.log
          echo "编译耗时：$(( $(date +%s) - START )) 秒"
          ccache -s

          ls -lh out/arch/arm64/boot/
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk

          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Melt Kernel for marble (CI build)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          device.name3=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          BOOT=kernel/out/arch/arm64/boot
          if   [ -f $BOOT/Image ];    then cp $BOOT/Image    AnyKernel3/
          elif [ -f $BOOT/Image.gz ]; then cp $BOOT/Image.gz AnyKernel3/
          else echo "::error::未找到内核镜像"; exit 1; fi

          echo "ZIP_NAME=Melt-marble-$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-AnyKernel3
          path: AnyKernel3/*

      - name: 上传 Image 和 .config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-raw
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/.config
            build.log

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            build.log
            kernel/out/.config
          if-no-files-found: ignore
