# oss-kernel-build.yml — SM8850 OSS 内核 GitHub Actions 云端编译（单文件自包含版）
#
# ★ 为什么是单文件：手机上 GitHub 无法直接上传文件夹。这个 workflow 把
#   拉取→编译→打包→上传 全部逻辑内联在自身，不依赖套件里任何其他文件。
#   你在手机 GitHub 网页只需要创建【这一个文件】即可跑云端编译。
#
# ★ 手机部署步骤（2 分钟）：
#   1) 手机浏览器打开 github.com → 登录 → 进入你的仓库
#   2) Add file → Create new file
#   3) 文件名框输入:  .github/workflows/oss-kernel-build.yml
#      （GitHub 会自动创建 .github/workflows 目录，无需上传文件夹）
#   4) 粘贴本文件全部内容 → Commit changes（选 Create a new branch 亦可）
#   5) 仓库 → Actions → "SM8850 OSS Kernel Build" → Run workflow
#      branch 默认 popsicle-w-oss（小米17 Pro Max / SM8850，6.12 基线，
#      与 17 Ultra 全系 ROM 内核一致，产物可直接用于 ROM）
#   6) 编译约 30~120 分钟（免费 runner 4核/16GB）→ 下载 sm8850-oss-kernel artifact
#   7) 产物（Image / dtb/ / modules/）拷进 ROM kernel 树 prebuilt，
#      按 docs/04 切换 BoardConfig 后刷机
#
# ★ 参数：
#   branch        内核分支（默认 popsicle-w-oss；任意仓库分支皆可）
#   kernel_url    内核仓库（默认小米官方；可改成任意 GitHub 内核仓库）
#   vendor_config 相对 arch/arm64/configs/ 的配置名（如 vendor/popsicle_GKI.config；
#                 留空自动探测：优先 vendor/*_GKI.config，其次 gki_defconfig）
#
# 编译失败时把 Actions 日志贴回来，按日志调 vendor_config 或 defconfig。

name: SM8850 OSS Kernel Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 内核分支（默认 popsicle-w-oss = 小米17 Pro Max / SM8850）
        type: string
        default: popsicle-w-oss
      kernel_url:
        description: 内核仓库 URL（默认小米官方；可改为任意 GitHub 内核仓库）
        type: string
        default: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
      vendor_config:
        description: vendor 配置（相对 arch/arm64/configs/，如 vendor/popsicle_GKI.config；留空自动探测）
        type: string
        default: ""

jobs:
  build:
    name: Build OSS Kernel (SM8850)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 安装依赖与 clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git make flex bison bc cpio \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler lz4 lzop xz-utils zstd \
            erofs-utils clang lld llvm
          clang --version | head -1

      - name: 拉取内核树
        run: |
          set -euo pipefail
          BR="${{ github.event.inputs.branch }}"
          URL="${{ github.event.inputs.kernel_url }}"
          echo "克隆 $URL @ $BR → kernel/sm8850"
          git clone --depth=1 --branch "$BR" "$URL" kernel/sm8850
          echo "树内容:" && ls kernel/sm8850 | head -20

      - name: 编译内核（自动探测 defconfig）
        run: |
          set -euo pipefail
          export ARCH=arm64 LLVM=1
          cd kernel/sm8850
          VCFG="${{ github.event.inputs.vendor_config }}"
          if [ -n "$VCFG" ]; then
            DEF="$VCFG"
          elif ls arch/arm64/configs/vendor/*_GKI.config >/dev/null 2>&1; then
            DEF="$(basename "$(ls arch/arm64/configs/vendor/*_GKI.config 2>/dev/null | head -1)")"
          elif [ -f arch/arm64/configs/gki_defconfig ]; then
            DEF=gki_defconfig
          else
            echo "未找到可用 defconfig，请从以下配置中选一个填 vendor_config：" >&2
            ls arch/arm64/configs/ | head -30 >&2
            exit 1
          fi
          echo "使用的 defconfig: $DEF"
          make "$DEF"
          echo "开始编译 (make -j$(nproc) Image dtbs modules)..."
          make -j"$(nproc)" Image dtbs modules

      - name: 收集产物到 prebuilt/oss
        run: |
          set -euo pipefail
          mkdir -p prebuilt/oss/dtb prebuilt/oss/modules
          cd kernel/sm8850
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../../prebuilt/oss/Image
          elif [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ../../prebuilt/oss/Image.gz-dtb
          else
            echo "未找到 Image，列出 boot 目录：" >&2
            ls arch/arm64/boot/ >&2
            exit 1
          fi
          cp arch/arm64/boot/dts/qcom/*.dtb ../../prebuilt/oss/dtb/ 2>/dev/null || true
          find . -name '*.ko' | while read -r f; do
            f="${f#./}"
            mkdir -p "../../prebuilt/oss/modules/$(dirname "$f")"
            cp "$f" "../../prebuilt/oss/modules/$f"
          done
          echo "产物清单:" && find ../../prebuilt/oss -type f | head -40

      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: sm8850-oss-kernel
          path: prebuilt/oss/
          if-no-files-found: error
          retention-days: 30
