# ============================================================================
# GitHub Actions 自动编译脚本：Melt Kernel (默认分支 melt-rebase)
# 适用内核: Redmi Note 12 Turbo (marble) / POCO F5 (marblein)
# 内核仓库: https://github.com/Pzqqt/android_kernel_xiaomi_marble
#
# 【无需 fork 内核仓库】
#   - 把本文件放到任何一个你自己拥有的仓库（可以是只放这一个工作流的
#     空仓库，不必是内核仓库的 fork），推送后即可在 Actions 页手动触发，
#     或 push 到该仓库的 main 分支自动触发。
#   - 工作流用 actions/checkout 的 repository 参数直接拉取上游内核仓库的
#     默认分支 melt-rebase，因此不需要 fork。
#
# 【已修复的问题（2026-10 实测失败记录）】
#   第一轮: make: *** [common/Makefile:196: __sub-make] Error 2
#     - 初判资源问题，实际经完整日志排查确认为**上游源码编译缺陷**（见下）。
#     - 保留的加固: MAKEFLAGS=-j2、4GB swap（dd 方式）、clang 收窄到
#       clang-r416183b、ubuntu-22.04、失败自诊断输出。
#   真正的根因（已从上游源码逐一确认）:
#     techpack/eva/msm/Kbuild 中 obj-m += msm-eva.o 会无条件编译 eva 模块，
#     其 msm_cvp_internal.h 使用 struct synx_session 字段，而 synx_api.h
#     只在 CONFIG_MSM_GLOBAL_SYNX 开启时才定义该结构体；上游 gki_defconfig
#     未开启该选项（vendor/parrot_GKI.config 里有 CONFIG_MSM_GLOBAL_SYNX=m，
#     但构建流程没有应用该片段）→ 编译报
#     "field has incomplete type 'struct synx_session'" 后失败。
#   修复: 在 checkout 后把 CONFIG_MSM_GLOBAL_SYNX=m 补进 gki_defconfig
#     （见下方 "Patch defconfig" 步骤）。=m 为模块，不影响 GKI vmlinux/ABI。
#
# 说明:
#   - 上游默认分支 melt-rebase 本身没有 CI。该分支是标准 AOSP ACK
#     (android12-5.10 MSM) 内核树，本工作流按 AOSP 官方文档方式编译:
#       repo init/sync (获取 kernel/build 构建系统 + 预编译工具链)
#       BUILD_CONFIG=common/build.config.msm.parrot build/build.sh
#   - build.config.msm.parrot 会做「GKI + vendor」混合构建，产物包含
#     boot.img / vendor_boot.img / dtbo.img / dtb / Image / 内核模块等，
#     可直接用 fastboot 刷入对应分区。
#   - 配额提醒: 公开仓库的 Actions 分钟数免费不限量；私有仓库免费额度
#     约 2000 分钟/月（建议用公开仓库，或去仓库 Settings 里启用私有仓库 Actions）。
# ============================================================================

name: Build Melt Kernel (no fork, upstream default branch)

on:
  push:
    branches: [main]          # push 到你自己的 builder 仓库 main 分支时触发
  workflow_dispatch:          # 或在 Actions 页手动触发（推荐）

# 同一分支新 push 时取消进行中的旧构建，节省配额
concurrency:
  group: melt-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04   # 固定 22.04：与 android12-5.10 内核年代匹配，host gcc 兼容性最稳
    env:
      BUILD_CONFIG: common/build.config.msm.parrot
      LTO: thin   # <24GB 内存必须用 thin LTO，官方推荐
      MAKEFLAGS: -j2   # 标准 runner 只有 7GB 内存，4 路并行必 OOM；-j2 最稳
    steps:
      # ------------------------------------------------------------
      # 1. 释放磁盘空间：标准 runner 只有 ~14GB，先清掉预装的大组件
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup
          df -h

      # ------------------------------------------------------------
      # 2. 安装依赖（repo 工具）
      # ------------------------------------------------------------
      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          repo --version

      # ------------------------------------------------------------
      # 3. 同步 AOSP 构建环境（kernel/build 构建系统 + 预编译工具链）
      #    manifest: kernel/manifest 分支 common-android12-5.10
      #    - 剔除清单中的 stock common 项目（稍后换成 Melt 源码）
      #    - 保留 common-modules（避免构建系统引用缺失）
      #    - 把 clang 从全版本 master 收窄到构建配置指定的 clang-r416183b
      #      （build.config.common 里 CLANG_PREBUILT_BIN 固定用它，省 ~15GB）
      # ------------------------------------------------------------
      - name: Sync AOSP build environment
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10
          # 去掉 stock common（稍后由上游 Melt 源码替换）
          sed -i '/path="common"/d' .repo/manifests/*.xml
          # 收窄 clang 版本（若清单格式不匹配则跳过，不影响构建）
          sed -i 's#path="prebuilts-master/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="master"#path="prebuilts-master/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="clang-r416183b"#' \
            .repo/manifests/*.xml
          repo sync -c -j4

      # ------------------------------------------------------------
      # 4. 直接拉取上游内核源码（无需 fork！指定 repository 即可）
      #    分支 = 上游默认分支 melt-rebase，检出到 common/
      # ------------------------------------------------------------
      - name: Checkout upstream kernel (melt-rebase)
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble   # 上游仓库，无需 fork
          ref: melt-rebase                                  # 上游默认分支
          path: common

      # ------------------------------------------------------------
      # 4b. 修复上游树的编译缺陷，均已从源码确认根因:
      #   [1] 合并 vendor 配置片段 vendor/parrot_GKI.config 到 gki_defconfig
      #       - techpack 模块（eva/cvp/video/camera/rmnet…）无条件编译，
      #         其链接所需 core 符号（qcom_mdt_load、qmi_*、mem_buf_*、
      #         qcom_iommu_get_fault_ids…）由片段中的 CONFIG 控制：
      #         CONFIG_QCOM_MDT_LOADER=m、CONFIG_QCOM_SCM=m、
      #         CONFIG_QCOM_MEM_BUF=m、CONFIG_QCOM_IOMMU_UTIL=m、
      #         CONFIG_MSM_GLOBAL_SYNX=m（synx）…
      #       - 但 AOSP build.sh 从不应用该片段 → modpost undefined symbol
      #       修复: 整段追加（defconfig 解析时后行覆盖前行，等价 merge_config；
      #       已核对片段中的 "is not set" 行不会关闭 gki_defconfig 任何 =y 项）
      #   [2] 修复 include/linux/qcom_scm.h 的残缺 stub（CONFIG_QCOM_SCM 未开启的 #else 分支）
      #       a) 3 个 "static inline ...;" 声明后残留独立的 "{ return -ENODEV; }"
      #          → "expected identifier or '('"（cvp_dump.o 首报）
      #       b) qcom_get_scm_device 是裸 static（漏了 inline），未使用时被
      #          CONFIG_WERROR=-Werror 升级为 "unused function" 错误
      #       修复: 去掉声明末尾的多余分号；为该函数补上 inline
      #       （应用 [1] 后 CONFIG_QCOM_SCM=m 走真实分支，此修复不生效但保留兜底）
      # ------------------------------------------------------------
      - name: Patch upstream source (merge vendor config + fix qcom_scm.h)
        run: |
          # [1] 合并 vendor 配置片段到 gki_defconfig
          FRAG=common/arch/arm64/configs/vendor/parrot_GKI.config
          DEFC=common/arch/arm64/configs/gki_defconfig
          if [ ! -f "$FRAG" ]; then
            echo "!!! 未找到 $FRAG，上游结构可能已变，构建中止"; exit 1
          fi
          cat "$FRAG" >> "$DEFC"
          echo "已合并 vendor/parrot_GKI.config ($(wc -l < "$FRAG") 行) 到 gki_defconfig"
          # 关闭 CONFIG_WERROR（Kconfig 默认 y，gki_defconfig 未显式设置）:
          # techpack 第三方代码大量 unused 警告被 -Werror 升级为错误；
          # 无任何配置 select WERROR，defconfig 关闭必定生效（与构建系统透传无关）
          grep -q "^# CONFIG_WERROR is not set" "$DEFC" || \
            echo "# CONFIG_WERROR is not set" >> "$DEFC"
          grep -n "CONFIG_WERROR" "$DEFC"
          grep -n "CONFIG_QCOM_MDT_LOADER\|CONFIG_QCOM_SCM\|CONFIG_MSM_GLOBAL_SYNX\|CONFIG_QCOM_MEM_BUF" "$DEFC" | tail -4
          # [2] 修复 qcom_scm.h 残缺 stub（分号 + 漏掉的 inline，兜底）
          python3 -c "import re; p='common/include/linux/qcom_scm.h'; s=open(p).read(); f=re.sub(r'(static inline (?:[^;]|\n)*?);\n(\s*\{ return -ENODEV; \})', r'\1\n\2', s); f=f.replace('static void *qcom_get_scm_device(void)', 'static inline void *qcom_get_scm_device(void)'); assert f!=s, 'qcom_scm.h 未匹配到待修复代码，上游可能已更新'; open(p,'w').write(f); print('qcom_scm.h 修复完成')"
          grep -n "qcom_scm_lmh_dcvsh\|qcom_scm_lmh_profile_change\|qcom_scm_lmh_dcvsh_available\|qcom_get_scm_device" common/include/linux/qcom_scm.h

      # ------------------------------------------------------------
      # 5. 创建 swap 兜底内存峰值（7GB 内存编译大内核容易 OOM）
      # ------------------------------------------------------------
      - name: Create swapfile (4GB)
        run: |
          # runner 上 fallocate 会报 Text file busy（已知问题），改用 dd 写盘；
          # 先清掉已有 swap 保证步骤可重复执行（幂等）
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      # ------------------------------------------------------------
      # 6. 编译内核（GKI + vendor 混合构建）
      #    产物目录: out/android12-5.10/dist/ (boot.img, vendor_boot.img,
      #              dtbo.img, dtb.img, Image, vmlinux.symvers, 内核模块...)
      #    日志通过 tee 留存；失败时自动打印其中的关键错误行，
      #    不再需要手动翻找（构建输出仍实时显示在日志里）
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set +e
          set -o pipefail
          # 上游树 CONFIG_WERROR=y 把大量 warning 升级为 error（已连报
          # unused-function / unused-variable 多起）。对 vendor/techpack
          # 这类第三方代码统一豁免 unused 类警告（只关闭警告报告，
          # 不影响代码生成与产物），避免逐个修源码、反复迭代。
          export KCFLAGS="-Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-unused-label -Wno-unused-value -Wno-unused-parameter"
          echo "===== 确认 synx 补丁状态 ====="
          grep -n "MSM_GLOBAL_SYNX" common/arch/arm64/configs/gki_defconfig \
            || echo "!! gki_defconfig 中未找到 MSM_GLOBAL_SYNX（补丁未生效）"
          BUILD_CONFIG=common/build.config.msm.parrot LTO=thin build/build.sh 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== build.sh 退出码: $rc ====="
            echo "===== 日志中的关键错误行（真正的报错在这里）====="
            grep -nE "error:|Error [0-9]+|No rule|undefined|incomplete|cannot|not found|Killed|No space|fatal" /tmp/build.log | tail -50
            echo "===== 日志最后 30 行 ====="
            tail -30 /tmp/build.log
            echo "===== 失败后内存/磁盘状态 ====="
            free -h
            df -h
            exit "$rc"
          fi
          echo "===== 编译成功 ====="

      # ------------------------------------------------------------
      # 7. 列出产物（便于排查）
      # ------------------------------------------------------------
      - name: List build outputs
        run: |
          find out -maxdepth 4 -type d -name dist -exec ls -lh {} \;

      # ------------------------------------------------------------
      # 8. 上传产物到 Actions 页面，可下载
      # ------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melt-kernel-${{ github.run_number }}
          path: |
            out/**/dist/**
          if-no-files-found: error
