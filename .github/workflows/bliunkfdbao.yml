# ============================================================================
# GitHub Actions 自动编译脚本：Melt Kernel (默认分支 melt-rebase)
# 适用内核: Redmi Note 12 Turbo (marble) / POCO F5 (marblein)
# 内核仓库: https://github.com/Pzqqt/android_kernel_xiaomi_marble
#
# 【无需 fork 内核仓库】
#   - 把本文件放到任何一个你自己拥有的仓库（可以是只放这一个工作流的
#     空仓库，不必是内核仓库的 fork），推送后即可在 Actions 页手动触发，
#     或 push 到该仓库的 main 分支自动触发。
#   - 工作流用 actions/checkout 的 repository 参数直接拉取上游内核仓库的
#     默认分支 melt-rebase，因此不需要 fork。
#
# 说明:
#   - 上游默认分支 melt-rebase 本身没有 CI。该分支是标准 AOSP ACK
#     (android12-5.10 MSM) 内核树，本工作流按 AOSP 官方文档方式编译:
#       repo init/sync (获取 kernel/build 构建系统 + 全部预编译工具链)
#       BUILD_CONFIG=common/build.config.msm.parrot build/build.sh
#   - build.config.msm.parrot 会做「GKI + vendor」混合构建，产物包含
#     boot.img / vendor_boot.img / dtbo.img / dtb / Image / 内核模块等，
#     可直接用 fastboot 刷入对应分区。
#   - 配额提醒: 公开仓库的 Actions 分钟数免费不限量；私有仓库免费额度
#     约 2000 分钟/月（建议用公开仓库，或去仓库 Settings 里启用私有仓库 Actions）。
# ============================================================================

name: Build Melt Kernel (no fork, upstream default branch)

on:
  push:
    branches: [main]          # push 到你自己的 builder 仓库 main 分支时触发
  workflow_dispatch:          # 或在 Actions 页手动触发（推荐）

# 同一分支新 push 时取消进行中的旧构建，节省配额
concurrency:
  group: melt-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: common/build.config.msm.parrot
      LTO: thin   # 标准 runner 只有 7GB 内存，thin LTO 防止 OOM（官方推荐 <24GB 内存用）
    steps:
      # ------------------------------------------------------------
      # 1. 释放磁盘空间：标准 runner 只有 ~14GB，先清掉预装的大组件
      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup
          df -h

      # ------------------------------------------------------------
      # 2. 安装依赖（repo 工具）
      # ------------------------------------------------------------
      - name: Install repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3
          curl -sSf https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          repo --version

      # ------------------------------------------------------------
      # 3. 同步 AOSP 构建环境（kernel/build 构建系统 + clang/gas/build-tools 预编译）
      #    manifest: kernel/manifest 分支 common-android12-5.10
      #    用 sed 从清单里剔除 stock common/common-modules，稍后换成 Melt 源码
      # ------------------------------------------------------------
      - name: Sync AOSP build environment
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10
          # 跳过清单中的通用内核项目（会替换为下方拉取的 Melt 源码）
          sed -i '/path="common"/d; /path="common-modules"/d' .repo/manifests/*.xml
          repo sync -c -j$(nproc)

      # ------------------------------------------------------------
      # 4. 直接拉取上游内核源码（无需 fork！指定 repository 即可）
      #    分支 = 上游默认分支 melt-rebase，检出到 common/
      # ------------------------------------------------------------
      - name: Checkout upstream kernel (melt-rebase)
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble   # 上游仓库，无需 fork
          ref: melt-rebase                                  # 上游默认分支
          path: common

      # ------------------------------------------------------------
      # 5. 编译内核（GKI + vendor 混合构建）
      #    产物目录: out/android12-5.10/dist/ (boot.img, vendor_boot.img,
      #              dtbo.img, dtb.img, Image, vmlinux.symvers, 内核模块...)
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          BUILD_CONFIG=common/build.config.msm.parrot LTO=thin build/build.sh

      # ------------------------------------------------------------
      # 6. 列出产物（便于排查）
      # ------------------------------------------------------------
      - name: List build outputs
        run: |
          find out -maxdepth 4 -type d -name dist -exec ls -lh {} \;

      # ------------------------------------------------------------
      # 7. 上传产物到 Actions 页面，可下载
      # ------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: melt-kernel-${{ github.run_number }}
          path: |
            out/**/dist/**
          if-no-files-found: error
