name: Build Melt Kernel (marble)

on:
  # ① Actions 页面手动触发
  workflow_dispatch:
    inputs:
      build_ksu:
        description: "额外构建 KernelSU 版本 Image"
        type: boolean
        default: true
      build_susfs:
        description: "额外构建 KernelSU + SUSFS 版本 Image"
        type: boolean
        default: true
      package_ak3:
        description: "打包成 AnyKernel3 卡刷包"
        type: boolean
        default: true
  # ② 也可以推送到 bouquet_ci 分支时自动编译
  push:
    branches: [ bouquet_ci ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KERNEL_BRANCH: bouquet_ci          # build_bouquet.sh 所在分支
  LLVM_VERSION: 23.1.1               # 与脚本内 CLANG_PATH 保持一致，不要随意改
  CCACHE_DIR: /home/runner/.ccache
  CCACHE: ccache
  AK3_REPO: https://github.com/Pzqqt/AnyKernel3.git
  AK3_BRANCH: Marble-Bouquet

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360             # 三次构建（含一次全量）留足时间

    steps:
      # ---------- 0. 清磁盘：内核 + LTO + ccache 很吃空间 ----------
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # ---------- 1. 拉源码（bouquet_ci 分支，放到 kernel/ 子目录）----------
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: 设置构建信息
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:12}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # ---------- 2. 缓存工具链 ----------
      - name: 恢复 Slim LLVM 缓存
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/build_toolchain/llvm-${{ env.LLVM_VERSION }}-x86_64.tar.xz
          key: llvm-${{ env.LLVM_VERSION }}-x86_64

      - name: 下载 Slim LLVM（缓存未命中时）
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          mkdir -p ~/build_toolchain && cd ~/build_toolchain
          aria2c -x8 -s8 -k1M \
            https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-${{ env.LLVM_VERSION }}-x86_64.tar.xz

      # ---------- 3. 安装依赖 + 解压工具链 ----------
      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison flex libssl-dev libelf-dev kmod cpio zstd lz4 \
            xz-utils zip unzip device-tree-compiler ccache wget \
            python3 python-is-python3 python3-rich

          mkdir -p ~/.local/bin
          export PATH="$HOME/.local/bin:$PATH"

          # 7za：打包用；hdiffz/hpatchz：生成 ksu/susfs 差分补丁用
          mkdir -p /tmp/7z && cd /tmp/7z
          wget -nv https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz
          tar -xJf 7z2603-linux-x64.tar.xz
          (cp -f 7zzs ~/.local/bin/7za 2>/dev/null || cp -f 7zz ~/.local/bin/7za)

          mkdir -p /tmp/hdiff && cd /tmp/hdiff
          wget -nv https://github.com/sisong/HDiffPatch/releases/download/v4.12.2/hdiffpatch_v4.12.2_bin_linux64.zip
          7za x -y hdiffpatch_v4.12.2_bin_linux64.zip
          cp -f linux64/hdiffz linux64/hpatchz ~/.local/bin/

          chmod +x ~/.local/bin/*
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          cd ~/build_toolchain
          tar -xJf llvm-${{ env.LLVM_VERSION }}-x86_64.tar.xz

          ccache --max-size=2G
          ccache --zero-stats
          df -h /

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-marble-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-marble-${{ runner.os }}-

      # ---------- 4. 构建 ----------
      - name: 编译内核（原版 Image + 内核模块 + dtb/dtbo）
        run: |
          cd $GITHUB_WORKSPACE/kernel
          chmod +x build_bouquet.sh
          ./build_bouquet.sh
          mkdir -p ~/dist
          cp -r ~/Bouquet_marble_out/. ~/dist/
          ls -lh ~/dist

      - name: 编译 KernelSU 版本 Image
        if: ${{ github.event_name == 'push' || inputs.build_ksu }}
        run: |
          [ -d ~/KernelSU ] || git clone --depth=1 https://github.com/tiann/KernelSU.git ~/KernelSU
          cd $GITHUB_WORKSPACE/kernel
          ./build_bouquet.sh --noclean --ksu -- Image
          cp -f ~/Bouquet_marble_out/Image_ksu* ~/dist/

      - name: 编译 KernelSU + SUSFS 版本 Image
        if: ${{ github.event_name == 'push' || inputs.build_susfs }}
        continue-on-error: true          # susfs 补丁可能与新内核有冲突，失败不中断流程
        run: |
          [ -d ~/susfs4ksu ] || \
            git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ~/susfs4ksu
          cd $GITHUB_WORKSPACE/kernel
          ./build_bouquet.sh --susfs -- Image
          cp -f ~/Bouquet_marble_out/Image_susfs* ~/dist/

      - name: ccache 统计
        if: always()
        run: ccache --show-stats

      # ---------- 5. 打包 AnyKernel3 卡刷包 ----------
      - name: 打包 AnyKernel3
        if: ${{ (github.event_name == 'push' || inputs.package_ak3) }}
        run: |
          set -e
          git clone --depth=1 -b ${{ env.AK3_BRANCH }} ${{ env.AK3_REPO }} ~/AnyKernel3
          cd ~/AnyKernel3

          rm -f ./Image*
          cp -f ~/dist/devicetree/ukee.dtb    ./_dtb/dtb
          cp -f ~/dist/devicetree/dtbo.img    ./_dtb/dtbo.img
          cp -f ~/dist/alt_kernel_modules/*   ./_modules_hyperos/_alt/
          cp -f ~/dist/vendor_boot_modules/*  ./_modules_hyperos/_vendor_boot_modules/
          cp -f ~/dist/vendor_dlkm_modules/*  ./_modules_hyperos/_vendor_dlkm_modules/
          cp -f ~/dist/Image*                 ./

          python3 ./make_package.py "ci-${BUILD_DATE}-${SHORT_SHA}"
          ls -lh ~/AnyKernel3/*.zip

      # ---------- 6. 上传产物 ----------
      - name: 上传卡刷包
        if: ${{ (github.event_name == 'push' || inputs.package_ak3) }}
        uses: actions/upload-artifact@v4
        with:
          name: Bouquet-Kernel-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: ~/AnyKernel3/Bouquet-Kernel-*.zip
          if-no-files-found: error

      - name: 上传 Image / 模块 / dtb（fastboot 直刷用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          path: |
            ~/dist/Image*
            ~/dist/vendor_boot_modules/
            ~/dist/vendor_dlkm_modules/
            ~/dist/devicetree/
          if-no-files-found: warn
